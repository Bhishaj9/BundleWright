[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bundlewright"
version = "1.0.0"
description = "Build a deployable, self-verifying release bundle (source + compose + observability + secrets + SHA256SUMS + .tar.gz)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gaurav Vashistha", email = "gaurav.vashistha09@gmail.com" }]
keywords = ["release", "bundle", "deploy", "docker-compose", "packaging", "checksums"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Bhishaj9/BundleWright"
Repository = "https://github.com/Bhishaj9/BundleWright"
Issues = "https://github.com/Bhishaj9/BundleWright/issues"
Changelog = "https://github.com/Bhishaj9/BundleWright/blob/main/CHANGELOG.md"

[project.scripts]
bundlewright = "bundlewright.cli:main"

[tool.setuptools]
packages = ["bundlewright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
